<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Under the Ring — Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f5f2ec;
  --surface: #ffffff;
  --surface2: #edeae3;
  --border: #d8d3c8;
  --fg: #1c1914;
  --fg-muted: #6b6460;
  --fg-faint: #9e9890;
  --accent: #8b3a0f;
  --accent-dim: #f2e8e0;
  --accent-mid: #b85c2a;
  --gold: #8a6d20;
  --gold-dim: #f5f0de;
  --green: #3a6040;
  --green-dim: #e4ede6;
  --nav-bg: #1c1410;
  --nav-fg: #c4b4a4;
  --nav-active: #e8c87a;
  --tag-quest: #7a3a8a;
  --tag-quest-dim: #f0e6f5;
  --font-display: 'Cinzel', Georgia, serif;
  --font-body: 'Source Serif 4', Georgia, serif;
  --font-ui: 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17100d;
    --surface: #221610;
    --surface2: #2c1e16;
    --border: #3d2d22;
    --fg: #f0e8e0;
    --fg-muted: #a09080;
    --fg-faint: #6a5a50;
    --accent: #d46030;
    --accent-dim: #2e1808;
    --accent-mid: #e88050;
    --gold: #c8a040;
    --gold-dim: #28200a;
    --green: #508060;
    --green-dim: #0e2016;
    --nav-bg: #0e0a06;
    --nav-fg: #a09080;
    --nav-active: #e8c87a;
    --tag-quest: #b080c0;
    --tag-quest-dim: #200828;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17100d;
  --surface: #221610;
  --surface2: #2c1e16;
  --border: #3d2d22;
  --fg: #f0e8e0;
  --fg-muted: #a09080;
  --fg-faint: #6a5a50;
  --accent: #d46030;
  --accent-dim: #2e1808;
  --accent-mid: #e88050;
  --gold: #c8a040;
  --gold-dim: #28200a;
  --green: #508060;
  --green-dim: #0e2016;
  --nav-bg: #0e0a06;
  --nav-fg: #a09080;
  --nav-active: #e8c87a;
  --tag-quest: #b080c0;
  --tag-quest-dim: #200828;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.65;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* TOP BAR */
.topbar {
  background: var(--nav-bg);
  display: flex;
  align-items: center;
  gap: 0;
  flex-shrink: 0;
  border-bottom: 1px solid #3d2d22;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-title {
  font-family: var(--font-display);
  font-size: 0.75rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--nav-active);
  padding: 0.75rem 1.5rem 0.75rem 0;
  border-right: 1px solid #3d2d22;
  white-space: nowrap;
}
.tabs {
  display: flex;
  gap: 0;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  font-family: var(--font-ui);
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--nav-fg);
  padding: 0.85rem 1.1rem;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}
.tab:hover { color: #e0d0c0; }
.tab.active { color: var(--nav-active); border-bottom-color: var(--nav-active); }

/* MAIN LAYOUT */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* LEFT LIST */
.list-pane {
  width: 220px;
  min-width: 220px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  background: var(--surface2);
  flex-shrink: 0;
  position: relative;
  z-index: 2;
  isolation: isolate;
}
.list-search {
  padding: 0.6rem 0.75rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  position: sticky;
  top: 0;
  z-index: 1;
}
.list-search input {
  width: 100%;
  font-family: var(--font-ui);
  font-size: 0.78rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.35rem 0.6rem;
  color: var(--fg);
  outline: none;
}
.list-search input:focus { border-color: var(--accent-mid); }
.list-search input::placeholder { color: var(--fg-faint); }
.list-item {
  padding: 0.55rem 0.9rem;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-ui);
  font-size: 0.82rem;
  color: var(--fg);
  transition: background 0.1s;
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}
.list-item:hover { background: var(--surface); }
.list-item.active { background: var(--accent-dim); border-left: 3px solid var(--accent); padding-left: calc(0.9rem - 3px); }
.list-item-name { font-weight: 500; }
.list-item-sub { font-size: 0.72rem; color: var(--fg-muted); }

/* LIST SECTION HEADERS */
.list-section-header {
  padding: 0.45rem 0.9rem 0.3rem;
  font-family: var(--font-ui);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-faint);
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
}
.list-section-header span { transition: transform 0.15s; }
.list-section-content.hidden { display: none; }

/* NESTED SECTION HEADERS (sub-categories indented) */
.list-section-content .list-section-header {
  padding-left: 1.6rem;
  font-size: 0.59rem;
  background: var(--bg);
  color: var(--fg-faint);
  opacity: 0.85;
}
.list-section-content .list-section-content .list-section-header {
  padding-left: 2.3rem;
  font-size: 0.57rem;
}
.list-section-content .list-item {
  padding-left: 1.6rem;
}
.list-section-content .list-section-content .list-item {
  padding-left: 2.3rem;
}
.list-section-content .list-item.active {
  padding-left: calc(1.6rem - 3px);
}
.list-section-content .list-section-content .list-item.active {
  padding-left: calc(2.3rem - 3px);
}

/* DETAIL PANE */
.detail-pane {
  flex: 1;
  overflow-y: auto;
  padding: 1.75rem 2rem;
  padding-left: max(2rem, env(safe-area-inset-left, 0px));
  padding-right: max(2rem, env(safe-area-inset-right, 0px));
  min-width: 0;
  position: relative;
  z-index: 1;
  isolation: isolate;
}
.detail-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--fg-faint);
  font-family: var(--font-ui);
  font-size: 0.85rem;
  font-style: italic;
}

/* DETAIL CONTENT */
.detail-eyebrow {
  font-family: var(--font-ui);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 0.3rem;
}
.detail-title {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--fg);
  text-wrap: balance;
  margin-bottom: 0.2rem;
  line-height: 1.2;
}
.detail-role {
  font-family: var(--font-ui);
  font-size: 0.82rem;
  color: var(--fg-muted);
  font-style: italic;
  margin-bottom: 1rem;
}
.detail-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 1rem 0;
}
.detail-section-label {
  font-family: var(--font-ui);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 0.4rem;
}
.detail-body {
  font-size: 0.9rem;
  line-height: 1.75;
  color: var(--fg);
  max-width: 60ch;
}
.detail-body p { margin-bottom: 0.75rem; }
.detail-body p:last-child { margin-bottom: 0; }
.detail-body table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
}
.detail-body th, .detail-body td {
  padding: 0.35rem 0.6rem;
  border: 1px solid var(--border);
  text-align: left;
}
.detail-body th { background: var(--surface2); font-weight: 600; }
.detail-body strong { color: var(--fg); }

/* TAGS */
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-top: 0.5rem;
}
.tag {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  font-weight: 600;
  padding: 0.2rem 0.55rem;
  border-radius: 3px;
  cursor: pointer;
  transition: opacity 0.15s;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.tag:hover { opacity: 0.75; }
.tag-npc { background: var(--accent-dim); color: var(--accent); }
.tag-faction { background: var(--gold-dim); color: var(--gold); }
.tag-location { background: var(--green-dim); color: var(--green); }
.tag-quest { background: var(--tag-quest-dim); color: var(--tag-quest); }
.tag-plain {
  background: var(--surface2);
  color: var(--fg-muted);
  cursor: default;
}
.tag-plain:hover { opacity: 1; }

/* NPC STAT GRID — Claude artifact layout */
.npc-meta-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 0.6rem 1.2rem;
  margin: 0.75rem 0;
  max-width: 60ch;
}
.npc-meta-cell {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}
.npc-meta-label {
  font-family: var(--font-ui);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-faint);
}
.npc-meta-value {
  font-family: var(--font-ui);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--fg);
}

/* DM NOTE callout */
.dm-note {
  background: var(--gold-dim);
  border-left: 3px solid var(--gold);
  border-radius: 0 4px 4px 0;
  padding: 0.6rem 0.8rem;
  margin: 0.75rem 0;
  font-size: 0.875rem;
  line-height: 1.65;
  max-width: 60ch;
}
.dm-note-label {
  font-family: var(--font-ui);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.25rem;
}

/* LOOT — Claude artifact layout */
.loot-meta-grid {
  display: grid;
  grid-template-columns: repeat(3, auto);
  gap: 0.4rem 2rem;
  margin: 0.75rem 0;
  max-width: 60ch;
}
.loot-meta-cell {
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}
.loot-meta-label {
  font-family: var(--font-ui);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-faint);
}
.loot-meta-value {
  font-family: var(--font-ui);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--fg);
}
.loot-location-block {
  margin: 0.75rem 0;
  max-width: 60ch;
}
.loot-location-label {
  font-family: var(--font-ui);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-faint);
  margin-bottom: 0.2rem;
}
.loot-location-value {
  font-family: var(--font-ui);
  font-size: 0.85rem;
  color: var(--fg);
}
.mechanic-section {
  margin: 0.9rem 0 0.4rem;
  max-width: 60ch;
}
.mechanic-section-label {
  font-family: var(--font-ui);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.35rem;
}

/* STAT ROWS */
.stat-row {
  display: flex;
  gap: 2rem;
  margin-bottom: 0.75rem;
  flex-wrap: wrap;
}
.stat { display: flex; flex-direction: column; gap: 0.1rem; }
.stat-label {
  font-family: var(--font-ui);
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-muted);
}
.stat-val {
  font-family: var(--font-ui);
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--fg);
}

/* CALLOUT */
.callout {
  background: var(--surface2);
  border-left: 3px solid var(--border);
  border-radius: 0 4px 4px 0;
  padding: 0.6rem 0.8rem;
  margin: 0.75rem 0;
  font-size: 0.875rem;
  line-height: 1.65;
  max-width: 60ch;
}
.callout.red { border-left-color: #c0392b; background: #fdf0f0; }
.callout.yellow { border-left-color: var(--gold); background: var(--gold-dim); }
.callout.green { border-left-color: var(--green); background: var(--green-dim); }
.callout.blue { border-left-color: #2980b9; background: #edf6fb; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .callout.red { background: #2a0808; }
  :root:not([data-theme="light"]) .callout.blue { background: #0a1a28; }
}
:root[data-theme="dark"] .callout.red { background: #2a0808; }
:root[data-theme="dark"] .callout.blue { background: #0a1a28; }
.callout-label {
  font-family: var(--font-ui);
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 0.25rem;
}

/* QUEST STEP LIST */
.quest-steps { list-style: none; padding: 0; max-width: 60ch; }
.quest-steps li {
  display: flex;
  gap: 0.75rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.875rem;
  align-items: flex-start;
}
.quest-steps li:last-child { border-bottom: none; }
.step-num {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--fg-faint);
  min-width: 1.4rem;
  padding-top: 0.15rem;
}
.step-label {
  font-family: var(--font-ui);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent-mid);
  margin-bottom: 0.2rem;
}
.step-content { display: flex; flex-direction: column; gap: 0.15rem; }

/* TENSION METER */
.tension-bar {
  display: flex;
  gap: 3px;
  margin: 0.5rem 0 0.75rem;
  align-items: center;
}
.tension-pip {
  width: 28px;
  height: 10px;
  border-radius: 2px;
  background: var(--border);
}
.tension-pip.filled { background: var(--accent); }
.tension-pip.filled.danger { background: #8b0000; }
.tension-label {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  color: var(--fg-muted);
  margin-left: 0.5rem;
}

/* CODEX LINKS in detail */
.codex-links {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-top: 0.6rem;
  padding-top: 0.6rem;
  border-top: 1px solid var(--border);
}

/* BACK BUTTON (mobile only) */
.back-btn {
  display: none;
  font-family: var(--font-ui);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--accent-mid);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0.6rem 0;
  margin-bottom: 0.75rem;
  letter-spacing: 0.04em;
}
.back-btn::before { content: '← '; }

/* LOADING */
.loading-state {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 0.6rem;
  color: var(--fg-faint);
  font-family: var(--font-ui);
  font-size: 0.82rem;
}
.loading-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--fg-faint);
  animation: pulse 1.2s ease-in-out infinite;
}
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse {
  0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1); }
}

/* MOBILE */
@media (max-width: 640px) {
  html, body { height: 100%; overflow: hidden; }
  .main { flex-direction: column; height: 100%; overflow: hidden; }
  .list-pane {
    width: 100%; min-width: 0;
    border-right: none;
    border-bottom: 1px solid var(--border);
    flex: 1;
    overflow-y: auto;
  }
  .list-pane.hidden { display: none; }
  .detail-pane {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: none;
  }
  .detail-pane.visible { display: block; }
  .detail-title { font-size: 1.2rem; }
  .back-btn { display: inline-block; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">Under the Ring</div>
  <div class="tabs">
    <button class="tab" onclick="switchTab('codex')">Codex</button>
    <button class="tab active" onclick="switchTab('npcs')">NPCs</button>
    <button class="tab" onclick="switchTab('factions')">Factions</button>
    <button class="tab" onclick="switchTab('locations')">Locations</button>
    <button class="tab" onclick="switchTab('quests')">Quests</button>
    <button class="tab" onclick="switchTab('loot')">Loot</button>
  </div>
</div>

<div class="main">
  <div class="list-pane">
    <div class="list-search">
      <input type="text" id="search-input" placeholder="Search…" oninput="filterList(this.value)">
    </div>
    <div id="list-items">
      <div class="loading-state">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    </div>
  </div>
  <div class="detail-pane" id="detail-pane">
    <div class="detail-empty">Select an entry to view details</div>
  </div>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────

let DATA = { npcs: [], factions: [], locations: [], quests: [], loot: [] };
// Change 7: four groups including planes
let CODEX = { overviews: [], worldLore: [], planes: [], gmToolbox: [] };

// Normalize JSON data to the shape the rendering functions expect.
function normalizeItem(item, tab) {
  const n = Object.assign({}, item);

  // sub (list subtitle) — use subtitle field
  if (!n.sub) n.sub = n.subtitle || '';

  // eyebrow — derive from tags if not present
  if (!n.eyebrow) {
    const tagStr = (n.tags || []).join(', ');
    n.eyebrow = tagStr;
  }

  // stats: normalize value -> val
  if (Array.isArray(n.stats)) {
    n.stats = n.stats.map(s => ({ label: s.label, val: s.val !== undefined ? s.val : s.value }));
  }

  // role — use subtitle as role for npcs/factions detail header
  if (!n.role) n.role = n.subtitle || '';

  // campaign flag — npcs that have boon are quasigods, flag campaign
  if (tab === 'npcs' && n.boon) {
    n.campaign = true;
  }

  // arc — derive from tags for quests
  if (tab === 'quests' && !n.arc) {
    const arcTag = (n.tags || []).find(t => t.startsWith('Arc'));
    n.arc = arcTag || 'Arc 1';
  }

  // tensionLevel default
  if (n.id === 'the-war' && n.tensionLevel === undefined) {
    n.tensionLevel = 0;
  }

  return n;
}

async function loadData() {
  try {
    const [npcs, factions, locations, quests, loot, codex] = await Promise.all([
      fetch('data/npcs.json').then(r => r.json()),
      fetch('data/factions.json').then(r => r.json()),
      fetch('data/locations.json').then(r => r.json()),
      fetch('data/quests.json').then(r => r.json()),
      fetch('data/loot.json').then(r => r.json()),
      fetch('data/codex.json').then(r => r.json()),
    ]);
    DATA.npcs = npcs.map(i => normalizeItem(i, 'npcs'));
    DATA.factions = factions.map(i => normalizeItem(i, 'factions'));
    DATA.locations = locations.map(i => normalizeItem(i, 'locations'));
    DATA.quests = quests.map(i => normalizeItem(i, 'quests'));
    DATA.loot = loot.map(i => normalizeItem(i, 'loot'));
    // Change 7: build CODEX with planes group
    // worldLore items marked _planes: true go into planes group; rest stay in worldLore
    CODEX.overviews = codex.overviews || [];
    const wl = codex.worldLore || [];
    CODEX.planes = wl.filter(i => i._planes === true);
    CODEX.worldLore = wl.filter(i => !i._planes);
    CODEX.gmToolbox = codex.gmToolbox || [];
    renderList('');
  } catch (err) {
    document.getElementById('list-items').innerHTML =
      '<div class="loading-state" style="color:var(--accent)">Failed to load data</div>';
    console.error(err);
  }
}

// ─── STATE ────────────────────────────────────────────────────────────────────

let currentTab = 'npcs';
let currentId = null;

function switchTab(tab) {
  currentTab = tab;
  currentId = null;
  document.querySelectorAll('.tab').forEach((el, i) => {
    const tabs = ['codex','npcs','factions','locations','quests','loot'];
    el.classList.toggle('active', tabs[i] === tab);
  });
  const listPane = document.querySelector('.list-pane');
  const detailPane = document.getElementById('detail-pane');
  listPane.classList.remove('hidden');
  detailPane.style.display = '';
  detailPane.innerHTML = '<div class="detail-empty">Select an entry to view details</div>';
  document.getElementById('search-input').value = '';
  renderList('');
}

// ─── CODEX ────────────────────────────────────────────────────────────────────

function renderCodexLinks(links) {
  if (!links || typeof links !== 'object') return '';
  const tabMap = { npcs: 'npc', factions: 'faction', locations: 'location', quests: 'quest', loot: 'loot' };
  const tags = [];
  for (const [tab, ids] of Object.entries(links)) {
    if (!Array.isArray(ids)) continue;
    const cls = tabMap[tab] || 'plain';
    const pool = DATA[tab] || [];
    for (const id of ids) {
      const entry = pool.find(e => e.id === id);
      const label = entry ? (entry.name || entry.title || id) : id;
      tags.push(`<span class="tag tag-${cls}" onclick="navigate('${tab}','${id}')">${label}</span>`);
    }
  }
  return tags.join('');
}


// ─── LIST ─────────────────────────────────────────────────────────────────────

function filterList(q) {
  renderList(q);
}

function makeListEl(item) {
  const el = document.createElement('div');
  el.className = 'list-item' + (item.id === currentId ? ' active' : '');
  el.onclick = () => selectItem(item.id);
  el.innerHTML = `<div class="list-item-name">${item.name}</div>${item.sub ? `<div class="list-item-sub">${item.sub}</div>` : ''}`;
  return el;
}

// Change 1: sectionState defaults to open (true) for all sections
const sectionState = {};

function makeSectionHeader(label, sectionKey, items, container) {
  // Change 1: default open — sectionState[key] is true unless explicitly set false
  const open = sectionState[sectionKey] !== false;
  const header = document.createElement('div');
  header.className = 'list-section-header';
  header.innerHTML = `<span>${label}</span><span>${open ? '▾' : '▸'}</span>`;

  const content = document.createElement('div');
  content.className = 'list-section-content' + (open ? '' : ' hidden');

  items.forEach(item => content.appendChild(makeListEl(item)));

  header.onclick = () => {
    const hidden = content.classList.toggle('hidden');
    header.querySelector('span:last-child').textContent = hidden ? '▸' : '▾';
    sectionState[sectionKey] = !hidden;
  };

  container.appendChild(header);
  container.appendChild(content);
}

function renderList(q) {
  const container = document.getElementById('list-items');
  if (!container) return;
  container.innerHTML = '';

  const lower = (q || '').toLowerCase();

  function matches(item) {
    if (!lower) return true;
    return (item.name || '').toLowerCase().includes(lower) ||
           (item.title || '').toLowerCase().includes(lower) ||
           (item.sub || '').toLowerCase().includes(lower) ||
           (item.subtitle || '').toLowerCase().includes(lower);
  }

  // Codex — Overviews, World Lore (with The Planes nested inside), GM Toolbox
  if (currentTab === 'codex') {
    // Overviews
    const overviewItems = (CODEX.overviews || [])
      .map(item => ({ id: item.id || item.title, name: item.title, sub: item.eyebrow || '' }))
      .filter(matches);
    if (overviewItems.length) makeSectionHeader('Overviews', 'codex-overviews', overviewItems, container);

    // World Lore as a parent that contains The Planes as a nested child
    const wlItems = (CODEX.worldLore || [])
      .map(item => ({ id: item.id || item.title, name: item.title, sub: item.eyebrow || '' }))
      .filter(matches);
    const planesItems = (CODEX.planes || [])
      .map(item => ({ id: item.id || item.title, name: item.title, sub: item.eyebrow || '' }))
      .filter(matches);

    if (wlItems.length || planesItems.length) {
      const wlOpen = sectionState['codex-worldLore'] !== false;
      const wlHeader = document.createElement('div');
      wlHeader.className = 'list-section-header';
      wlHeader.innerHTML = `<span>World Lore</span><span>${wlOpen ? '▾' : '▸'}</span>`;
      const wlContent = document.createElement('div');
      wlContent.className = 'list-section-content' + (wlOpen ? '' : ' hidden');
      wlHeader.onclick = () => {
        const hidden = wlContent.classList.toggle('hidden');
        wlHeader.querySelector('span:last-child').textContent = hidden ? '▸' : '▾';
        sectionState['codex-worldLore'] = !hidden;
      };
      container.appendChild(wlHeader);
      container.appendChild(wlContent);
      // Flat World Lore items first
      wlItems.forEach(item => wlContent.appendChild(makeListEl(item)));
      // The Planes as a nested sub-section
      if (planesItems.length) makeSectionHeader('The Planes', 'codex-planes', planesItems, wlContent);
    }

    // GM Toolbox
    const gmItems = (CODEX.gmToolbox || [])
      .map(item => ({ id: item.id || item.title, name: item.title, sub: item.eyebrow || '' }))
      .filter(matches);
    if (gmItems.length) makeSectionHeader('GM Toolbox', 'codex-gmToolbox', gmItems, container);
    return;
  }

  const items = (DATA[currentTab] || []).filter(matches);

  // Change 4: Locations — two-level grouping: Region > Ward
  if (currentTab === 'locations') {
    // Region map: Sigil is the only region currently; all wards fall under it
    const sigil = items.filter(i => {
      const tags = i.tags || [];
      return tags.some(t => t.includes('Ward') || t === 'Sigil');
    });
    const other = items.filter(i => {
      const tags = i.tags || [];
      return !tags.some(t => t.includes('Ward') || t === 'Sigil');
    });

    const renderRegion = (regionLabel, regionItems, regionKey) => {
      if (!regionItems.length) return;
      // Sub-group by ward
      const byWard = {};
      const wardOrder = [];
      regionItems.forEach(item => {
        const wardTag = (item.tags || []).find(t => t.includes('Ward') || t === 'Lady\'s Ward') || 'Sigil';
        if (!byWard[wardTag]) { byWard[wardTag] = []; wardOrder.push(wardTag); }
        byWard[wardTag].push(item);
      });
      // If only one ward (or no sub-grouping needed), flat under region
      if (wardOrder.length === 1) {
        makeSectionHeader(regionLabel, regionKey, regionItems, container);
      } else {
        // Create a top-level section header that contains nested ward headers
        const open = sectionState[regionKey] !== false;
        const header = document.createElement('div');
        header.className = 'list-section-header';
        header.innerHTML = `<span>${regionLabel}</span><span>${open ? '▾' : '▸'}</span>`;
        const regionContent = document.createElement('div');
        regionContent.className = 'list-section-content' + (open ? '' : ' hidden');
        header.onclick = () => {
          const hidden = regionContent.classList.toggle('hidden');
          header.querySelector('span:last-child').textContent = hidden ? '▸' : '▾';
          sectionState[regionKey] = !hidden;
        };
        container.appendChild(header);
        container.appendChild(regionContent);
        wardOrder.forEach(ward => makeSectionHeader(ward, regionKey + '-' + ward, byWard[ward], regionContent));
      }
    };

    if (sigil.length) renderRegion('Sigil', sigil, 'loc-sigil');
    if (other.length) renderRegion('Other', other, 'loc-other');
    return;
  }

  // Change 3: Quests — ordered arc groups (Arc 1, Arc 2… then SIGIS/New Haven)
  if (currentTab === 'quests') {
    const arcOrder = ['Arc 1', 'Arc 2', 'Arc 3', 'Arc 4', 'Arc 5', 'Arc 6'];
    const byArc = {};
    arcOrder.forEach(a => { byArc[a] = []; });
    const sigis = [];
    const newHaven = [];
    const other = [];

    items.forEach(item => {
      const tags = item.tags || [];
      if (tags.some(t => t === 'SIGIS' || t.toLowerCase().includes('sigis'))) {
        sigis.push(item);
      } else if (tags.some(t => t.toLowerCase().includes('new haven') || t === 'New Haven')) {
        newHaven.push(item);
      } else {
        const arcTag = tags.find(t => arcOrder.includes(t)) || item.arc || 'Arc 1';
        if (!byArc[arcTag]) byArc[arcTag] = [];
        byArc[arcTag].push(item);
      }
    });

    arcOrder.forEach(arc => {
      if (byArc[arc] && byArc[arc].length) makeSectionHeader(arc, 'q-' + arc, byArc[arc], container);
    });
    if (sigis.length) makeSectionHeader('SIGIS', 'q-sigis', sigis, container);
    if (newHaven.length) makeSectionHeader('New Haven', 'q-newhaven', newHaven, container);
    if (other.length) makeSectionHeader('Other', 'q-other', other, container);
    return;
  }

  // Change 6: NPCs — two-level grouping: Campaign Wide > Quasigods; Sigil > subgroups; etc.
  if (currentTab === 'npcs') {
    // Top-level: Campaign Wide (Quasigods), then Sigil sub-groups by ward/faction
    const quasigods = items.filter(i => (i.tags || []).includes('Quasigod') || i.campaign);
    const sigilNpcs = items.filter(i => !(i.tags || []).includes('Quasigod') && !i.campaign);

    if (quasigods.length) {
      // Campaign Wide > Quasigods
      const cwOpen = sectionState['npc-campaign'] !== false;
      const cwHeader = document.createElement('div');
      cwHeader.className = 'list-section-header';
      cwHeader.innerHTML = `<span>Campaign Wide</span><span>${cwOpen ? '▾' : '▸'}</span>`;
      const cwContent = document.createElement('div');
      cwContent.className = 'list-section-content' + (cwOpen ? '' : ' hidden');
      cwHeader.onclick = () => {
        const hidden = cwContent.classList.toggle('hidden');
        cwHeader.querySelector('span:last-child').textContent = hidden ? '▸' : '▾';
        sectionState['npc-campaign'] = !hidden;
      };
      container.appendChild(cwHeader);
      container.appendChild(cwContent);
      makeSectionHeader('Quasigods', 'npc-gods', quasigods, cwContent);
    }

    if (sigilNpcs.length) {
      // Sigil > sub-groups by ward/affiliation tag
      const sigilOpen = sectionState['npc-sigil'] !== false;
      const sigilHeader = document.createElement('div');
      sigilHeader.className = 'list-section-header';
      sigilHeader.innerHTML = `<span>Sigil</span><span>${sigilOpen ? '▾' : '▸'}</span>`;
      const sigilContent = document.createElement('div');
      sigilContent.className = 'list-section-content' + (sigilOpen ? '' : ' hidden');
      sigilHeader.onclick = () => {
        const hidden = sigilContent.classList.toggle('hidden');
        sigilHeader.querySelector('span:last-child').textContent = hidden ? '▸' : '▾';
        sectionState['npc-sigil'] = !hidden;
      };
      container.appendChild(sigilHeader);
      container.appendChild(sigilContent);

      // Sub-group Sigil NPCs by ward tag
      const byGroup = {};
      const groupOrder = [];
      sigilNpcs.forEach(item => {
        const wardTag = (item.tags || []).find(t => t.includes('Ward')) ||
                        (item.tags || []).find(t => t === 'Campaign Antagonist') && 'Antagonists' ||
                        'Other';
        if (!byGroup[wardTag]) { byGroup[wardTag] = []; groupOrder.push(wardTag); }
        byGroup[wardTag].push(item);
      });
      groupOrder.forEach(g => makeSectionHeader(g, 'npc-sigil-' + g, byGroup[g], sigilContent));
    }
    return;
  }

  // Change 5: Factions — two-level: Sigil region > category
  if (currentTab === 'factions') {
    const sigilOpen = sectionState['fac-sigil'] !== false;
    const sigilHeader = document.createElement('div');
    sigilHeader.className = 'list-section-header';
    sigilHeader.innerHTML = `<span>Sigil</span><span>${sigilOpen ? '▾' : '▸'}</span>`;
    const sigilContent = document.createElement('div');
    sigilContent.className = 'list-section-content' + (sigilOpen ? '' : ' hidden');
    sigilHeader.onclick = () => {
      const hidden = sigilContent.classList.toggle('hidden');
      sigilHeader.querySelector('span:last-child').textContent = hidden ? '▸' : '▾';
      sectionState['fac-sigil'] = !hidden;
    };
    container.appendChild(sigilHeader);
    container.appendChild(sigilContent);

    const great = items.filter(i => (i.tags || []).includes('Great Faction'));
    // Change 5: Rusted Bell is Criminal
    const criminal = items.filter(i => (i.tags || []).includes('Criminal') || (i.tags || []).includes('Gang'));
    const other = items.filter(i =>
      !(i.tags || []).includes('Great Faction') &&
      !(i.tags || []).includes('Criminal') &&
      !(i.tags || []).includes('Gang')
    );
    if (great.length) makeSectionHeader('Great Factions', 'fac-great', great, sigilContent);
    if (criminal.length) makeSectionHeader('Criminal', 'fac-criminal', criminal, sigilContent);
    if (other.length) makeSectionHeader('Other', 'fac-other', other, sigilContent);
    return;
  }

  // Loot — three-level hierarchy: Plane > Ward/Sublocation > Building > items
  if (currentTab === 'loot') {
    // Classify each item into plane / ward / building from its tags.
    // Tags that identify item type (not location) — excluded from location detection:
    const TYPE_TAGS = new Set(['Book','Weapon','Shield','Magical','Non-Magical','Wondrous Item',
      'Rare','Uncommon','Common','Very Rare','Legendary','Ammunition','Ioun Stone',
      'Campaign MacGuffin','+1','+2','+3']);

    // Known ward keywords
    const WARD_KEYWORDS = ['Ward'];
    // Known building keywords
    const BUILDING_KEYWORDS = ['House','Basement','Shop','Crossing','Bag of','Reed'];

    function classifyItem(item) {
      const tags = item.tags || [];
      // Plane: check for explicit plane tag, default Sigil
      const planeTag = tags.find(t =>
        ['Sigil','Mechanus','Bytopia','Elysium','Outlands','The Planes'].includes(t)
      ) || 'Sigil';

      // Ward: find a "Ward" tag
      const wardTag = tags.find(t => WARD_KEYWORDS.some(kw => t.includes(kw))) || null;

      // Building: find a location-like tag, then normalize "Horus House Basement" -> "Horus House"
      let buildingTag = tags.find(t =>
        !TYPE_TAGS.has(t) &&
        !(WARD_KEYWORDS.some(kw => t.includes(kw))) &&
        (BUILDING_KEYWORDS.some(kw => t.includes(kw)))
      ) || null;
      if (buildingTag) buildingTag = buildingTag.replace(' Basement', '').replace(' basement', '');

      // Fallback: first non-type, non-ward, non-plane tag
      const fallback = tags.find(t =>
        !TYPE_TAGS.has(t) &&
        !(WARD_KEYWORDS.some(kw => t.includes(kw))) &&
        !['Sigil','Mechanus','Bytopia','Elysium','Outlands'].includes(t)
      ) || 'Unknown';

      return {
        plane: planeTag,
        ward: wardTag || 'Hive Ward',
        building: buildingTag || fallback,
      };
    }

    // Build three-level structure: plane > ward > building > [items]
    const byPlane = {};
    const planeOrder = [];

    items.forEach(item => {
      const { plane, ward, building } = classifyItem(item);
      if (!byPlane[plane]) { byPlane[plane] = { wards: {}, wardOrder: [] }; planeOrder.push(plane); }
      const planeObj = byPlane[plane];
      if (!planeObj.wards[ward]) { planeObj.wards[ward] = { buildings: {}, buildingOrder: [] }; planeObj.wardOrder.push(ward); }
      const wardObj = planeObj.wards[ward];
      if (!wardObj.buildings[building]) { wardObj.buildings[building] = []; wardObj.buildingOrder.push(building); }
      wardObj.buildings[building].push(item);
    });

    function makeNestedHeader(label, key, open, parentEl) {
      const h = document.createElement('div');
      h.className = 'list-section-header';
      h.innerHTML = `<span>${label}</span><span>${open ? '▾' : '▸'}</span>`;
      const c = document.createElement('div');
      c.className = 'list-section-content' + (open ? '' : ' hidden');
      h.onclick = () => {
        const hidden = c.classList.toggle('hidden');
        h.querySelector('span:last-child').textContent = hidden ? '▸' : '▾';
        sectionState[key] = !hidden;
      };
      parentEl.appendChild(h);
      parentEl.appendChild(c);
      return c;
    }

    planeOrder.forEach(plane => {
      const planeObj = byPlane[plane];
      const planeOpen = sectionState['loot-p-' + plane] !== false;
      const planeContent = makeNestedHeader(plane, 'loot-p-' + plane, planeOpen, container);

      planeObj.wardOrder.forEach(ward => {
        const wardObj = planeObj.wards[ward];
        const wardOpen = sectionState['loot-w-' + plane + ward] !== false;
        const wardContent = makeNestedHeader(ward, 'loot-w-' + plane + ward, wardOpen, planeContent);

        wardObj.buildingOrder.forEach(building => {
          const bldItems = wardObj.buildings[building];
          makeSectionHeader(building, 'loot-b-' + plane + ward + building, bldItems, wardContent);
        });
      });
    });
    return;
  }

  // Default: flat list
  items.forEach(item => container.appendChild(makeListEl(item)));
}

// ─── DETAIL ───────────────────────────────────────────────────────────────────

function selectItem(id) {
  currentId = id;
  document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.list-item').forEach(el => {
    if (el.onclick && el.onclick.toString().includes(`'${id}'`)) {
      el.classList.add('active');
    }
  });

  let item;
  if (currentTab === 'codex') {
    // Change 7: search all four groups
    const allCodex = [
      ...(CODEX.overviews || []),
      ...(CODEX.worldLore || []),
      ...(CODEX.planes || []),
      ...(CODEX.gmToolbox || [])
    ];
    item = allCodex.find(i => (i.id || i.title) === id);
    if (item) item = Object.assign({ _isCodex: true }, item);
  } else {
    item = (DATA[currentTab] || []).find(i => i.id === id);
  }
  if (!item) return;

  const listPane = document.querySelector('.list-pane');
  const detailPane = document.getElementById('detail-pane');
  listPane.classList.add('hidden');
  detailPane.classList.add('visible');

  renderDetail(item);
}

function navigate(tab, id) {
  switchTab(tab);
  selectItem(id);
}

function goBack() {
  const listPane = document.querySelector('.list-pane');
  const detailPane = document.getElementById('detail-pane');
  listPane.classList.remove('hidden');
  detailPane.classList.remove('visible');
  currentId = null;
}

function renderDetail(item) {
  const pane = document.getElementById('detail-pane');

  // Codex items
  if (item._isCodex) {
    const eyebrow = item.eyebrow || item.group || '';
    const isStub = item.stub === true;
    const links = renderCodexLinks(item.links);
    let html = `
      <button class="back-btn" onclick="goBack()">Back</button>
      ${eyebrow ? `<div class="detail-eyebrow">${eyebrow}</div>` : ''}
      <div class="detail-title">${item.title}</div>
      <hr class="detail-divider">
      <div class="detail-body${isStub ? '" style="font-style:italic;opacity:0.7' : ''}">${item.body || ''}</div>
    `;
    if (item.body2) {
      html += `<div class="detail-body" style="margin-top:1.2rem">${item.body2}</div>`;
    }
    if (links) {
      html += `<div class="codex-links">${links}</div>`;
    }
    pane.innerHTML = html;
    return;
  }

  // Build eyebrow from tags
  const eyebrow = item.eyebrow || (item.tags || []).join('  ·  ');

  // Change 8: NPC card — Claude artifact layout
  if (currentTab === 'npcs') {
    // Eyebrow label (NPC type from tags)
    const eyebrowLabel = item.campaign
      ? (item.tags || []).find(t => t === 'Quasigod') ? 'Quasigod' : 'NPC'
      : 'NPC';

    let html = `<button class="back-btn" onclick="goBack()">Back</button>`;
    html += `<div class="detail-eyebrow">${eyebrowLabel}</div>`;
    html += `<div class="detail-title">${item.name}</div>`;
    if (item.role && item.role !== item.name) {
      html += `<div class="detail-role">${item.role}</div>`;
    }
    html += `<hr class="detail-divider">`;

    // Metadata stat grid
    const metaCells = [];
    // Derive race from tags (first tag that looks like a race)
    const raceTag = (item.tags || []).find(t =>
      ['Tiefling','Human','Elf','Dwarf','Gnome','Halfling','Half-Elf','Half-Orc'].includes(t)
    );
    if (raceTag) metaCells.push({ label: 'Race', value: raceTag });
    if (item.faction) {
      // Look up faction name from DATA
      const fac = DATA.factions.find(f => f.id === item.faction);
      metaCells.push({ label: 'Faction', value: fac ? fac.name : item.faction });
    }
    if (item.location) {
      const loc = DATA.locations.find(l => l.id === item.location);
      metaCells.push({ label: 'Location', value: loc ? loc.name : item.location });
    }
    // Add ward from tags
    const wardTag = (item.tags || []).find(t => t.includes('Ward'));
    if (wardTag && !item.location) metaCells.push({ label: 'Ward', value: wardTag });

    if (metaCells.length) {
      html += `<div class="npc-meta-grid">`;
      metaCells.forEach(c => {
        html += `<div class="npc-meta-cell"><div class="npc-meta-label">${c.label}</div><div class="npc-meta-value">${c.value}</div></div>`;
      });
      html += `</div>`;
    }

    html += `<hr class="detail-divider">`;

    // Body — for quasigods, strip the inline Boon paragraph to avoid duplication
    if (item.body) {
      let bodyHtml = item.body;
      if (item.boon) {
        // Remove the paragraph that starts with <strong>Boon:</strong>
        bodyHtml = bodyHtml.replace(/<p[^>]*>\s*<strong>Boon:<\/strong>[\s\S]*?<\/p>/gi, '');
      }
      html += `<div class="detail-body">${bodyHtml}</div>`;
    }

    // Quasigod boon — one-time use with chip mechanic
    if (item.boon) {
      html += `<hr class="detail-divider">`;
      html += `<div class="detail-section-label" style="color:var(--gold)">Boon</div>`;
      html += `<div class="detail-body" style="margin-top:0.35rem">${item.boon}</div>`;
      html += `<div class="dm-note" style="margin-top:0.6rem">`;
      html += `<div class="dm-note-label">One-Time Use</div>`;
      html += `Each player receives a 3D-printed chip when they earn this boon. The chip is turned in to activate the boon. Once used, it is gone.`;
      html += `</div>`;
    }

    // DM Note callout (if callout exists, render as DM NOTE)
    if (item.callout) {
      const c = item.callout;
      if (c.type === 'red') {
        // Use DM NOTE style for red callouts on NPCs
        html += `<div class="dm-note" style="border-left-color:#c0392b;background:${
          window.matchMedia('(prefers-color-scheme: dark)').matches ? '#2a0808' : '#fdf0f0'
        }">`;
        html += `<div class="dm-note-label" style="color:#c0392b">${c.label || 'DM NOTE'}</div>`;
        html += c.text || '';
        html += `</div>`;
      } else {
        html += `<div class="callout ${c.type || ''}"><div class="callout-label">${c.label || ''}</div>${c.text || ''}</div>`;
      }
    }

    // Related (clickable cross-links)
    const relatedLinks = renderCodexLinks(item.links);
    if (relatedLinks) {
      html += `<hr class="detail-divider">`;
      html += `<div class="detail-section-label">Related</div>`;
      html += `<div class="tags" style="margin-top:0.35rem">${relatedLinks}</div>`;
    }

    pane.innerHTML = html;
    return;
  }

  // Change 9: Loot card — Claude artifact layout
  if (currentTab === 'loot') {
    const tags = item.tags || [];
    // Eyebrow: "LOOT — ARC NAME" from arc tag
    const arcTag = tags.find(t => t.includes('Arc') || t.includes('Hive')) || '';
    const eyebrowText = arcTag ? `LOOT — ${arcTag.toUpperCase()}` : 'LOOT';

    let html = `<button class="back-btn" onclick="goBack()">Back</button>`;
    html += `<div class="detail-eyebrow">${eyebrowText}</div>`;
    html += `<div class="detail-title">${item.name}</div>`;
    if (item.role && item.role !== item.name) {
      html += `<div class="detail-role">${item.role}</div>`;
    }
    html += `<hr class="detail-divider">`;

    // Metadata grid: Type | Plot Integral | Glow
    const typeTag = tags.find(t => ['Book','Weapon','Wondrous Item','Ammunition','Ioun Stone'].includes(t)) || 'Item';
    const rarityTag = tags.find(t => ['Common','Uncommon','Rare','Very Rare','Legendary','Non-Magical','Magical'].includes(t)) || '';
    const plotIntegral = tags.includes('Campaign MacGuffin') ? 'Yes' : 'No';
    // Glow: magical items glow, ioun stones glow
    const glows = tags.includes('Magical') || tags.includes('Ioun Stone') || tags.includes('+1') ? 'Yes' : 'No';

    html += `<div class="loot-meta-grid">`;
    html += `<div class="loot-meta-cell"><div class="loot-meta-label">Type</div><div class="loot-meta-value">${typeTag}${rarityTag ? ' (' + rarityTag + ')' : ''}</div></div>`;
    html += `<div class="loot-meta-cell"><div class="loot-meta-label">Plot Integral</div><div class="loot-meta-value">${plotIntegral}</div></div>`;
    html += `<div class="loot-meta-cell"><div class="loot-meta-label">Glow</div><div class="loot-meta-value">${glows}</div></div>`;
    html += `</div>`;

    // Location: from tags
    const locationTag = tags.find(t =>
      t.includes('House') || t.includes('Basement') || t.includes('Shop') ||
      t.includes('Ward') || t.includes('Crossing')
    );
    if (locationTag) {
      html += `<div class="loot-location-block">`;
      html += `<div class="loot-location-label">Location</div>`;
      html += `<div class="loot-location-value">${locationTag}</div>`;
      html += `</div>`;
    }

    html += `<hr class="detail-divider">`;

    // Body
    if (item.body) {
      html += `<div class="detail-body">${item.body}</div>`;
    }

    // Mechanics — render as named sections with gold headings
    if (item.mechanics) {
      html += `<hr class="detail-divider">`;
      // Parse mechanic sections from the HTML string
      // Mechanics are bold-labeled paragraphs: <strong>Label:</strong> text
      // Render each <p> with a <strong> opener as its own named mechanic section
      const mecDiv = document.createElement('div');
      mecDiv.innerHTML = item.mechanics;
      const children = Array.from(mecDiv.children);

      let hasSections = false;
      children.forEach(child => {
        const strong = child.querySelector('strong');
        if (strong && child.tagName === 'P') {
          const label = strong.textContent.replace(/:$/, '').trim();
          const rest = child.innerHTML.replace(strong.outerHTML, '').replace(/^:\s*/, '').trim();
          if (label) {
            hasSections = true;
            html += `<div class="mechanic-section">`;
            html += `<div class="mechanic-section-label">${label}</div>`;
            html += `<div class="detail-body">${rest}</div>`;
            html += `</div>`;
          }
        } else {
          html += `<div class="detail-body">${child.outerHTML}</div>`;
        }
      });

      // If no structured sections found, render as-is
      if (!hasSections) {
        html += `<div class="detail-body">${item.mechanics}</div>`;
      }
    }

    // Callout
    if (item.callout) {
      const c = item.callout;
      html += `<div class="callout ${c.type || ''}"><div class="callout-label">${c.label || ''}</div>${c.text || ''}</div>`;
    }

    // Related (clickable cross-links)
    const lootRelatedLinks = renderCodexLinks(item.links);
    if (lootRelatedLinks) {
      html += `<hr class="detail-divider">`;
      html += `<div class="detail-section-label">Related</div>`;
      html += `<div class="tags" style="margin-top:0.35rem">${lootRelatedLinks}</div>`;
    }

    pane.innerHTML = html;
    return;
  }

  // All other tabs (factions, locations, quests)
  let html = `
    <button class="back-btn" onclick="goBack()">Back</button>
    ${eyebrow ? `<div class="detail-eyebrow">${eyebrow}</div>` : ''}
    <div class="detail-title">${item.name}</div>
    ${item.role && item.role !== item.name ? `<div class="detail-role">${item.role}</div>` : ''}
    <hr class="detail-divider">
  `;

  // Tags row
  if (item.tags && item.tags.length) {
    html += `<div class="tags" style="margin-bottom:0.75rem">`;
    item.tags.forEach(t => {
      html += `<span class="tag tag-plain">${t}</span>`;
    });
    html += `</div>`;
  }

  // Stats block
  if (item.stats && item.stats.length) {
    html += `<div class="stat-row">`;
    item.stats.forEach(s => {
      html += `<div class="stat"><div class="stat-label">${s.label}</div><div class="stat-val">${s.val}</div></div>`;
    });
    html += `</div><hr class="detail-divider">`;
  }

  // Tension meter for the-war quest
  if (item.id === 'the-war') {
    const tl = item.tensionLevel || 0;
    html += `<div class="detail-section-label">Tension Track</div>
    <div class="tension-bar">
      ${[0,1,2,3,4,5].map(i => `<div class="tension-pip${i < tl ? (i >= 4 ? ' filled danger' : ' filled') : ''}" title="Tension ${i+1}"></div>`).join('')}
      <span class="tension-label">${tl} / 6</span>
    </div>`;
  }

  // Faction structured sections
  const factionSections = [
    { key: 'leader', label: 'Leader' },
    { key: 'ideology', label: 'Ideology' },
    { key: 'history', label: 'History' },
    { key: 'relevance', label: 'Relevance' },
  ];
  const hasFactionSections = factionSections.some(s => item[s.key]);
  if (hasFactionSections) {
    factionSections.forEach(({ key, label }) => {
      if (!item[key]) return;
      html += `<div class="detail-section-label" style="margin-top:1.2rem">${label}</div><div class="detail-body" style="margin-top:0.35rem">${item[key]}</div>`;
    });
  } else if (item.body) {
    html += `<div class="detail-body">${item.body}</div>`;
  }

  if (item.body2) {
    html += `<div class="detail-body" style="margin-top:1.2rem">${item.body2}</div>`;
  }

  // Change 11: Quest steps — fix [object Object] bug by rendering step.label + step.text
  if (item.steps && item.steps.length) {
    html += `<hr class="detail-divider"><div class="detail-section-label">Steps</div>
    <ul class="quest-steps">`;
    item.steps.forEach((s, i) => {
      if (typeof s === 'string') {
        // Plain string steps
        html += `<li><span class="step-num">${i+1}.</span><span>${s}</span></li>`;
      } else {
        // Object steps with label + text
        const label = s.label || s.name || '';
        const text = s.text || s.description || s.body || '';
        html += `<li>
          <span class="step-num">${i+1}.</span>
          <span class="step-content">
            ${label ? `<span class="step-label">${label}</span>` : ''}
            <span>${text}</span>
          </span>
        </li>`;
      }
    });
    html += `</ul>`;
  }

  // Callout
  if (item.callout) {
    const c = item.callout;
    html += `<div class="callout ${c.type || ''}"><div class="callout-label">${c.label || ''}</div>${c.text || ''}</div>`;
  }

  // Related (clickable cross-links)
  const otherRelatedLinks = renderCodexLinks(item.links);
  if (otherRelatedLinks) {
    html += `<hr class="detail-divider">`;
    html += `<div class="detail-section-label">Related</div>`;
    html += `<div class="tags" style="margin-top:0.35rem">${otherRelatedLinks}</div>`;
  }

  pane.innerHTML = html;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

loadData();
</script>

</body>
</html>
